<div class="container-fluid p-0">
    <!-- Betöltés jelző -->
    <div *ngIf="loading" class="text-center p-5">
        <div class="spinner-border text-info" role="status">
            <span class="visually-hidden">Betöltés...</span>
        </div>
        <p class="mt-2 text-info">Testsúly adatok betöltése...</p>
    </div>

    <!-- Megjelenítés, ha van legalább 2 adatpont -->
    <!-- A style="height: 400px;" kritikus a Chart.js megjelenítéséhez -->
    <div *ngIf="!loading && weightHistory.length >= 2" style="height: 400px;">
        <!-- A #weightChart hivatkozás kulcsfontosságú, ez köti össze a TS kóddal -->
        <canvas #weightChart></canvas>
    </div>

    <!-- Nincs adat üzenet -->
    <div *ngIf="!loading && weightHistory.length < 2" class="alert alert-warning text-center mb-0 p-4">
        <p class="mb-0 fs-5">
          <i class="bi bi-exclamation-triangle-fill me-2"></i>
          Nincs elegendő testsúly adat a grafikon megjelenítéséhez (minimum 2 bejegyzés szükséges).
        </p>
        <small class="text-muted">Kérjük, rögzítsd a testsúlyodat a Daily Note lapon.</small>
    </div>
</div>

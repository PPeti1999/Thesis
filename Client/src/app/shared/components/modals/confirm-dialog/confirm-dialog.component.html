<div class="modal-header bg-danger text-white">
    <h4 class="modal-title pull-left">{{title}}</h4>
    <button type="button" class="btn-close close pull-right" aria-label="Close" (click)="decline()">
      <span aria-hidden="true" class="visually-hidden">&times;</span>
    </button>
  </div>
  <div class="modal-body">
    <p class="fw-bold">{{message}}</p>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-secondary" (click)="decline()">{{btnCancelText}}</button>
    <button type="button" class="btn btn-danger" (click)="confirm()">{{btnOkText}}</button>
  </div>
